<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Dhingani Investment</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left"><div class="brand">🛒 Dhingani <span class="accent">Investment</span></div></div>
  </header>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Sign in to continue</p>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash">{% for m in messages %}<div>{{ m }}</div>{% endfor %}</div>
        {% endif %}
      {% endwith %}
      <form method="post">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="block">Log in</button>
      </form>
      <p class="auth-hint">Seeded accounts: admin / admin123 · cashier / cashier123</p>
    </div>
  </div>
</body>
</html>
