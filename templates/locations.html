{% extends 'base.html' %}
{% block content %}
<div class="page-head"><h1>Locations</h1></div>

<section class="panel">
  <h2>Add location</h2>
  <form method="post" class="inline-form">
    <div class="field">
      <label>Name</label>
      <input name="name" placeholder="e.g. Warehouse" required>
    </div>
    <button type="submit">Add</button>
  </form>
</section>

<section class="panel">
  <div class="table-wrap">
  <table>
    <tr><th>Name</th><th>Created</th></tr>
    {% for loc in locations %}
    <tr><td>{{ loc.name }}</td><td>{{ loc.created_at.strftime('%Y-%m-%d') }}</td></tr>
    {% else %}
    <tr><td colspan="2" class="empty-state">No locations yet.</td></tr>
    {% endfor %}
  </table>
  </div>
</section>
{% endblock %}
